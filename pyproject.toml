[project]
name = "alphalens"
version = "1.0.0"
description = "Calibrated, evidence-cited equity research assistant (NSE)"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "diskcache==5.6.3",
    "email-validator>=2.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pandas==2.2.3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.3",
    "pyjwt>=2.10.1",
    "pypdf>=5.1.0",
    "python-multipart>=0.0.18",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.36",
    "sse-starlette>=2.1.0",
    "structlog>=24.1",
    "uvicorn[standard]>=0.32.0",
    "yfinance==1.8.0",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",     # fuzz/property tests (Phase 3)
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "httpx>=0.27.0",
    "respx==0.23.1",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["N818", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]   # allow assert, test passwords, long test docstrings
"src/alphalens/api/**" = ["B008"]  # allow FastAPI Depends() in parameter defaults
"alembic/**" = ["E402", "E501"]  # allow late imports and auto-generated migration lines

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "scipy.*",
    "yfinance.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=alphalens --cov-report=term-missing"
markers = ["live: hits real external APIs (excluded from CI)"]

[tool.coverage.report]
fail_under = 80

[tool.bandit]
exclude_dirs = ["tests"]
